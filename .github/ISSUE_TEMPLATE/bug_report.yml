name: Bug report
description: Report a defect in laranail/waitlist-kit.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real subscribers' addresses or any secret. Suspected security issues go through SECURITY.md,
        never a public issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: The tag or commit of laranail/waitlist-kit.
    validations:
      required: true
  - type: dropdown
    id: campaign-type
    attributes:
      label: Campaign type
      options: [waitlist, coming soon, early access, not specific to one type]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the output of `php artisan laranail::waitlist-kit.doctor` if it is relevant.
    validations:
      required: true
